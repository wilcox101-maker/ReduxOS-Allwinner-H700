# swap tuning for zram-only swap (no disk swap on SD cards). Starting values; tune on hardware.
# zram is RAM: swapping anonymous pages is cheaper than dropping file cache (game/ROM data).
vm.swappiness = 100
# Read single pages back: zram has no seek cost to amortise, readahead only wastes CPU.
vm.page-cluster = 0
