# ReduxOS default ALSA routing. "default" -> the H616/H700 analog codec (card id "Codec")
# through dmix (so RetroArch, mpv and UI sounds can share the device) and a software volume
# control "PCM" that the volume keys adjust without disturbing the hardware output routing.
# Hardware mixer routing/levels are set once at boot by reduxos-audio-init.service.
pcm.!default {
    type plug
    slave.pcm "softvol"
}
pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control { name "PCM"; card "Codec" }
    max_dB 0.0
    min_dB -51.0
}
pcm.dmixer {
    type dmix
    ipc_key 2048
    slave { pcm "hw:Codec,0"; rate 48000; channels 2; period_size 1024; buffer_size 4096 }
}
ctl.!default { type hw; card "Codec" }
