# ReduxOS: autologin the unprivileged "player" user on tty1. player has a locked password
# (no login elsewhere) and is not in sudo; its ~/.bash_profile launches RetroArch on the KMS console.
# Other VTs (tty2-6) keep a normal login prompt (the admin account has no password until the owner provisions one).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin player --noclear %I $TERM
