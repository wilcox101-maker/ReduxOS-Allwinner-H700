# H700 RAM-tier default. One rule for every tier: a zram swap the size of RAM, capped at 1 GiB.
#   512 MB unit -> ~450 MiB zram, 1 GB -> ~950 MiB, 2 GB -> 1 GiB.
# zram only allocates what it stores; at zstd's typical 2.5-3:1 on anonymous memory, a full device
# costs roughly a third of its size in real RAM. noble's zram-generator (1.1.2) takes ONE algorithm.
[zram0]
zram-size = min(ram, 1024)
compression-algorithm = zstd
swap-priority = 100
