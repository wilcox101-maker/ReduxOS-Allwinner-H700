#!/usr/sbin/nft -f
# SPDX-License-Identifier: GPL-2.0-only
# ReduxOS host firewall (SECURITY.md): drop unsolicited inbound traffic.
# Allowed in: loopback, replies to our own connections, ICMP/ICMPv6, DHCP replies, and SSH (port 22,
# which only listens once the owner has provisioned a key). Everything outbound is allowed.
# Edit and run `nft -f /etc/nftables.conf`.
flush ruleset

table inet reduxos {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 68 accept comment "DHCPv4 client"
		udp dport 546 accept comment "DHCPv6 client"
		tcp dport 22 accept comment "SSH"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
