# RetroArch udev autoconfig for the RG34XX-SP front panel (kernel node "gpio-keys-gamepad").
# gpio-keys has no USB vendor/product id, so RetroArch matches purely on the input device name.
# Button indices are RetroArch's udev scan order (BTN_MISC..KEY_MAX ascending); derived from the
# device's kernel keycodes, not guessed.
input_driver = "udev"
input_device = "gpio-keys-gamepad"
input_vendor_id = "0"
input_product_id = "0"

# Face buttons (physical A=BTN_EAST, B=BTN_SOUTH, X=BTN_NORTH, Y=BTN_WEST)
input_a_btn = "1"
input_b_btn = "0"
input_x_btn = "2"
input_y_btn = "3"
# Shoulders / triggers
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
# Stick clicks (the sticks themselves are a separate adc-joystick device; see frontend doc)
input_l3_btn = "11"
input_r3_btn = "12"
# System
input_select_btn = "8"
input_start_btn = "9"
input_menu_toggle_btn = "10"
# D-pad (discrete gpio keys, not a hat)
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"
