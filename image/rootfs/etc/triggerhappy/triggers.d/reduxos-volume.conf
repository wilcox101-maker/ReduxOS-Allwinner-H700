# ReduxOS volume keys (gpio-keys-volume: KEY_VOLUMEUP/KEY_VOLUMEDOWN). triggerhappy runs these at
# the OS level (menus, mpv, shell). While RetroArch is in front it may grab the key device and use
# its own audio-volume bind instead; that interaction is a hardware-test item (frontend doc).
KEY_VOLUMEUP    1  /usr/local/sbin/reduxos-vol.sh up
KEY_VOLUMEUP    2  /usr/local/sbin/reduxos-vol.sh up
KEY_VOLUMEDOWN  1  /usr/local/sbin/reduxos-vol.sh down
KEY_VOLUMEDOWN  2  /usr/local/sbin/reduxos-vol.sh down
