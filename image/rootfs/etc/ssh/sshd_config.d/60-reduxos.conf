# ReduxOS SSH defaults (SECURITY.md). SSH is OFF by default: ssh.service and ssh.socket are disabled in
# the image and only enabled on first boot when the owner provisions a key (h700-firstboot reads
# /boot/reduxos/authorized_keys). Host keys are generated per unit on first boot; none ship.
# No password login for anyone, root included: root may log in with a key the owner installs, never
# with a password. No credential of any kind ships in the image.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
