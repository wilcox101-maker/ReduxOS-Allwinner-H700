# SPDX-License-Identifier: GPL-2.0-only
# ReduxOS global RetroArch defaults, for the RG34XX-SP: 720x480 IPS, Mali-G31 (Panfrost GLES),
# H616/H700 analog codec, gpio-keys gamepad + dual ADC sticks. Players may override in their own
# ~/.config/retroarch/retroarch.cfg; this file is the first-boot baseline.

# --- Video: KMS/GBM, no desktop ---
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_windowed_fullscreen = "false"
video_smooth = "false"
video_threaded = "true"
video_vsync = "true"
# Native panel size; cores scale into it. Aspect kept per-core.
video_fullscreen_x = "720"
video_fullscreen_y = "480"
aspect_ratio_index = "22"

# --- Input: udev (kernel gpio-keys + adc-joystick) ---
input_driver = "udev"
input_joypad_driver = "udev"
input_max_users = "1"
# Menu toggle is the device's Menu button (BTN_MODE -> RetroPad "Guide"/button 8); see frontend doc.
input_menu_toggle_gamepad_combo = "0"
all_users_control_menu = "true"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/etc/retroarch/autoconfig"

# --- Audio: ALSA, our default device routes to the Codec card with a soft volume control ---
audio_driver = "alsa"
audio_device = "default"
audio_enable = "true"

# --- Menu: rgui is crisp and cheap at 720x480; xmb assets are installed if a player prefers them ---
menu_driver = "rgui"
rgui_aspect_ratio = "0"
menu_show_load_content_animation = "false"
video_font_enable = "true"

# --- Paths (Debian/Ubuntu layout) ---
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
# Content/system/saves live on the user card; created on first boot by h700-firstboot if absent.
system_directory = "/roms/bios"
savefile_directory = "/roms/saves"
savestate_directory = "/roms/states"
rgui_browser_directory = "/roms"
# one playlist per system, written by redux-scan-roms (reduxos-playlists.service, each boot)
playlist_directory = "~/.config/retroarch/playlists"

# --- Power/UX on a handheld ---
pause_nonactive = "false"
menu_pause_libretro = "true"
quit_press_twice = "true"
